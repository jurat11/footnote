name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create environment and install project
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest

      - name: Verifier tests (the guarantee)
        run: uv run pytest tests/test_verify.py tests/test_render.py tests/test_engine_template.py -q
